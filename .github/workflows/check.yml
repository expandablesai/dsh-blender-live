name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the Host half
        run: node --check index.js
      - name: Syntax-check the Client half
        run: node --check client.js
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8')); console.log('locale/en.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8')); console.log('locale/zh.json ok')"
      - name: Required files present
        run: |
          for f in index.js client.js cordis.patch.yml icon.svg README.md LICENSE; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
